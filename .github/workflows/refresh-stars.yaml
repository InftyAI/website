name: Refresh Stars

# The homepage project cards read their GitHub star counts at build time, so a
# rebuild is the only thing needed to refresh them. Netlify only rebuilds on
# push, which is why this pokes a build hook on a schedule instead.
#
# Setup: Netlify → Site configuration → Build & deploy → Build hooks → add a
# hook on `main`, then store its URL as the NETLIFY_BUILD_HOOK repository
# secret.

on:
  schedule:
    # 03:00 UTC daily. GitHub may delay scheduled runs when the shared runner
    # pool is busy, so treat this as "once a day", not "at 03:00 sharp".
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a Netlify build
        env:
          BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$BUILD_HOOK" ]; then
            echo "::error::NETLIFY_BUILD_HOOK is not set; see the comment in this workflow."
            exit 1
          fi
          curl --fail --silent --show-error -X POST -d '{}' "$BUILD_HOOK"
