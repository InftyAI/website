title = "InftyAI"
baseurl = "https://www.inftyai.com/"
canonifyURLs = false
disableAliases = true
disableHugoGeneratorInject = true
# disableKinds = ["taxonomy", "term"]
enableEmoji = true
enableGitInfo = false
enableRobotsTXT = true
languageCode = "en-US"
pagerSize = 10
rssLimit = 10
summarylength = 20 # 70 (default)

# Multilingual
defaultContentLanguage = "en"
disableLanguages = ["de", "nl"]
defaultContentLanguageInSubdir = false

[build.buildStats]
  enable = true

[outputs]
  # SITEMAP on `home` is what produces /sitemap.xml. The Doks starter left it off,
  # so the root sitemap was never generated even though robots.txt advertises it —
  # only the per-section /blog/sitemap.xml existed.
  home = ["HTML", "RSS", "searchIndex", "SITEMAP"]
  section = ["HTML", "RSS", "SITEMAP"]

[outputFormats.searchIndex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true

# Add output format for section sitemap.xml
[outputFormats.SITEMAP]
  mediaType = "application/xml"
  baseName = "sitemap"
  isHTML = false
  isPlainText = true
  noUgly = true
  rel  = "sitemap"

[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 0.5

[caches]
  [caches.getjson]
    dir = ":cacheDir/:project"
    maxAge = -1 # "30m"
  # GitHub star counts (resources.GetRemote). These are only the seed values for
  # first paint and the card ordering — assets/js/custom.js replaces the numbers
  # from /.netlify/functions/stars on every visit, so what a reader sees is at
  # most an hour old regardless of when the site last built. A TTL here just
  # stops repeated deploys from spending the 60 requests/hour unauthenticated
  # API budget; Netlify persists this cache between builds.
  [caches.getresource]
    dir = ":cacheDir/:project"
    maxAge = "12h"

# Allow reading GITHUB_TOKEN so CI can raise the GitHub API rate limit when
# fetching star counts. Repeats Hugo's defaults, which this setting replaces.
[security.funcs]
  getenv = ['^HUGO_', '^CI$', '^GITHUB_TOKEN$']

[taxonomies]
  contributor = "contributors"
  category = "categories"
  tag = "tags"

[permalinks]
  blog = "/blog/:slug/"
  docs = "/docs/:sections[1:]/:slug/"
# docs = "/docs/1.0/:sections[1:]/:slug/"

[minify.tdewolff.html]
  keepWhitespace = false

[related]
  threshold = 80
  includeNewer = true
  toLower = false
    [[related.indices]]
      name = "categories"
      weight = 100
    [[related.indices]]
      name = "tags"
      weight = 80
    [[related.indices]]
      name = "date"
      weight = 10

[imaging]
  anchor = "Center"
  bgColor = "#ffffff"
  hint = "photo"
  quality = 85
  resampleFilter = "Lanczos"
