# Homepage project cards. `repo` is used to look up the GitHub star count at
# build time; cards are rendered in descending order of stars.
#
# There is no `icon` field. An emoji beside the title sat between the card's left
# edge and the project name, and emoji render at widths nothing here controls, so
# the seven names began at seven different x positions. Put one in `name` or
# `description` if a card wants it — then it is part of the text, and it lines up
# with everything else on the line.
projects:
  - name: Awesome-LLMOps
    repo: InftyAI/Awesome-LLMOps
    url: https://github.com/InftyAI/Awesome-LLMOps
    description: "An awesome & curated list of best LLMOps tools."

  - name: llmaz
    repo: InftyAI/llmaz
    url: https://github.com/InftyAI/llmaz
    description: "Easy, advanced inference platform for large language models on Kubernetes."

  - name: Alphatrion
    repo: InftyAI/alphatrion
    url: https://github.com/InftyAI/alphatrion
    description: "The open-source framework for LLM experiments and agent orchestration."

  - name: AMRS
    repo: InftyAI/amrs
    url: https://github.com/InftyAI/amrs
    description: "The adaptive model routing system for exploration and exploitation."

  - name: SandD
    repo: InftyAI/sandd
    url: https://github.com/InftyAI/sandd
    description: "A lightweight sandbox daemon for secure agent execution in isolated environments."

  - name: Nebula
    repo: InftyAI/Nebula
    url: https://github.com/InftyAI/Nebula
    description: "The control plane for GPUaaS."

  - name: MLX
    repo: InftyAI/mlx
    url: https://github.com/InftyAI/mlx
    description: "Rust bindings for Apple's MLX framework."

# Rendered below the grid as one line — not a project, so it has no `repo` (no
# star count). `url` is optional: set it and the name becomes a link; leave it out
# and the line is plain text, as it was.
cta:
  name: "✨ Donation Plan"
  description: "Got a brilliant idea? Let's build something extraordinary together."
