# Homepage project cards. `repo` is used to look up the GitHub star count at
# build time; cards are rendered in descending order of stars.
#
# There is no `icon` field. An emoji beside the title sat between the card's left
# edge and the project name, and emoji render at widths nothing here controls, so
# the seven names began at seven different x positions. Put one in `name` or
# `description` if a card wants it — then it is part of the text, and it lines up
# with everything else on the line.
projects:
  - name: Awesome-LLMOps
    repo: InftyAI/Awesome-LLMOps
    url: https://github.com/InftyAI/Awesome-LLMOps
    description: "A curated list of the best LLMOps tools."

  - name: Awesome-Kernel-Agents
    repo: InftyAI/Awesome-Kernel-Agents
    url: https://github.com/InftyAI/Awesome-Kernel-Agents
    description: "A curated list of AI agents for GPU kernel generation, optimization, and verification."

  - name: llmaz
    repo: InftyAI/llmaz
    url: https://github.com/InftyAI/llmaz
    description: "An easy-to-use, production-grade inference platform for LLMs on Kubernetes."

  - name: Alphatrion
    repo: InftyAI/alphatrion
    url: https://github.com/InftyAI/alphatrion
    description: "A framework for LLM experiments and agent orchestration."

  # - name: AMRS
  #   repo: InftyAI/amrs
  #   url: https://github.com/InftyAI/amrs
  #   description: "The adaptive model routing system for exploration and exploitation."

  - name: SandD
    repo: InftyAI/sandd
    url: https://github.com/InftyAI/sandd
    description: "A lightweight sandbox daemon for secure agent execution in isolated environments."

  - name: Nebula
    repo: InftyAI/Nebula
    url: https://github.com/InftyAI/Nebula
    description: "The control plane for GPUaaS — across neoclouds, hyperscalers, and your own infrastructure."

  - name: MLX
    repo: InftyAI/mlx
    url: https://github.com/InftyAI/mlx
    description: "Rust bindings for Apple's MLX framework."

# The link under the grid: the cards are a selection, the rest are on GitHub.
more:
  name: "More on GitHub"
  url: https://github.com/InftyAI

# The page's closing block, below the grid: `title`, an optional `text` under it,
# then a button for each of `links`. No `text` for now — every line tried here
# restated the lead at the top of the page. The first link is the main action
# and is drawn filled. `icon` is optional — `discord` or `heart` (see the cta
# section in home.html).
cta:
  title: "Build. Grow. Together."
  links:
    - name: "Join our Discord"
      icon: discord
      url: https://discord.com/invite/UWnjUG6X8j
    - name: "Sponsor"
      icon: heart
      url: https://opencollective.com/inftyai
